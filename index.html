const OLD_TOTAL_TARGET = 9005;   // original per-category targets in the sheet sum to this
const NEW_TOTAL_TARGET = 8000;   // your new goal
const TARGET_SCALE = NEW_TOTAL_TARGET / OLD_TOTAL_TARGET; // applied to every group/category target below
const TOTAL_TARGET = NEW_TOTAL_TARGET;
const TOTAL_AVG = 10910.08;

/* ============ LIVE CONNECTION ============
   Once you deploy the Apps Script (Code.gs) as a Web App, paste its URL
   and your token into the Settings panel — this dashboard will then read
   live from your Google Sheet and let you add expenses that write back to it.
*/
let CONFIG = {
  url: localStorage.getItem('budget_apps_script_url') || '',
  token: localStorage.getItem('budget_apps_script_token') || ''
};
let liveData = null;       // raw response from doGet, once fetched
let liveError = null;
let liveLoading = false;

function saveConfig(url, token){
  CONFIG = {url: url.trim(), token: token.trim()};
  localStorage.setItem('budget_apps_script_url', CONFIG.url);
  localStorage.setItem('budget_apps_script_token', CONFIG.token);
}

async function fetchLiveData(){
  if(!CONFIG.url || !CONFIG.token) return;
  liveLoading = true; liveError = null;
  render();
  try{
    const sep = CONFIG.url.includes('?') ? '&' : '?';
    const res = await fetch(CONFIG.url + sep + 'token=' + encodeURIComponent(CONFIG.token));
    const data = await res.json();
    if(data.error){ liveError = data.error; liveData = null; }
    else { liveData = data; liveError = null; }
  }catch(err){
    liveError = 'Could not reach the sheet (' + err.message + ')';
    liveData = null;
  }
  liveLoading = false;
  render();
}

async function postExpense(entry){
  if(!CONFIG.url || !CONFIG.token) throw new Error('Connect your sheet in Settings first.');
  const sep = CONFIG.url.includes('?') ? '&' : '?';
  const res = await fetch(CONFIG.url + sep + 'token=' + encodeURIComponent(CONFIG.token), {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'}, // avoids CORS preflight against Apps Script
    body: JSON.stringify(entry)
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

/* Effective values: live sheet data if connected, else the static Jan–Jul baseline above.
   TARGET_SCALE is applied uniformly so the new 8,000 PLN goal is reflected everywhere
   without needing to touch the targets stored in the sheet itself. */
function getGroups(){
  const base = (liveData && liveData.groups) ? liveData.groups
    : GROUP_ORDER.map(g => ({name:g, target:GROUP_TARGETS[g], avg:groupAvg(g)}));
  return base.map(g => {
    const target = g.target * TARGET_SCALE;
    return {...g, target, variance: target - g.avg};
  });
}
function getCategories(){
  const base = (liveData && liveData.categories) ? liveData.categories.map(c=>({...c, monthly: (CATEGORIES.find(x=>x.name===c.name)||{}).monthly || []})) : CATEGORIES;
  return base.map(c => {
    const target = c.target * TARGET_SCALE;
    return {...c, target, variance: target - c.avg};
  });
}
function getTotals(){
  const base = (liveData && liveData.totals) ? liveData.totals : {avg: TOTAL_AVG, target: OLD_TOTAL_TARGET};
  const target = NEW_TOTAL_TARGET; // already the true total, no need to rescale the total itself
  return {avg: base.avg, target, cutPct: (base.avg-target)/base.avg};
}
function getCategoryOptions(){
  if(liveData && liveData.categoryOptions) return liveData.categoryOptions;
  return CATEGORIES.map(c=>({name:c.name, group:c.group}));
}
function getEntries(){
  return (liveData && liveData.entries) ? liveData.entries : [];
}

/* Current month (from the Expense Log's own live monthly-by-group table) */
const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function getCurrentMonthData(){
  const now = new Date();
  const mIdx = now.getMonth(); // 0=Jan
  const dayOfMonth = now.getDate();
  const daysInMonth = new Date(now.getFullYear(), mIdx+1, 0).getDate();

  if(!liveData || !liveData.monthlyByGroup) return null;
  const rows = liveData.monthlyByGroup;
  const totalRow = rows.find(r => (r.name||'').toString().toUpperCase().includes('TOTAL'));
  if(!totalRow) return null;

  const spend = Math.abs(Number(totalRow.months[mIdx]) || 0);
  if(spend === 0) return { monthName: MONTH_NAMES[mIdx], spend: 0, dayOfMonth, daysInMonth, empty: true };

  const groupSpend = rows.filter(r => r !== totalRow).map(r => ({
    name: r.name, spend: Math.abs(Number(r.months[mIdx]) || 0)
  }));

  const pace = dayOfMonth > 0 ? (spend / dayOfMonth) * daysInMonth : spend;

  return {
    monthName: MONTH_NAMES[mIdx], spend, dayOfMonth, daysInMonth, pace, groupSpend, empty: false
  };
}

/* Month-over-month totals: Jan–Jul from the static baseline (CATEGORIES.monthly),
   plus any live months (Aug+) that actually have logged data. */
function getMonthlyTotals(){
  const staticMonths = MONTH_NAMES.slice(0,7).map((name, i) => ({
    name,
    total: CATEGORIES.reduce((s,c) => s + (c.monthly[i]||0), 0)
  }));

  let liveMonths = [];
  if(liveData && liveData.monthlyByGroup){
    const totalRow = liveData.monthlyByGroup.find(r => (r.name||'').toString().toUpperCase().includes('TOTAL'));
    if(totalRow){
      for(let i=7; i<12; i++){
        const v = Math.abs(Number(totalRow.months[i]) || 0);
        if(v>0) liveMonths.push({name: MONTH_NAMES[i], total: v});
      }
    }
  }
  return staticMonths.concat(liveMonths);
}

  return (rounded<0?"-":"") + Math.abs(rounded).toLocaleString('en-US') + " zł";

  const s = n.toFixed(0);
  return (n<0?"-":"") + Math.abs(n).toFixed(0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",") + " zł";
};
const pct = n => (n*100).toFixed(1) + "%";

/* ============ RENDER ROOT ============ */
const root = document.getElementById('root');

function computeSimTotals(){
  let total = 0;
  const byGroup = {};
  GROUP_ORDER.forEach(g=>byGroup[g]=0);
  CATEGORIES.forEach(c=>{
    const v = state.sim[c.name];
    total += v;
    byGroup[c.group] += v;
  });
  return {total, byGroup};
}

}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;

/* ============ CURRENT MONTH HERO ============ */
function buildCurrentMonthHero(){
  const section = el('div','wrap');
  const cm = getCurrentMonthData();
  const target = NEW_TOTAL_TARGET;

  if(!cm){
    const card = el('div','cm-hero cm-hero-empty');
    card.innerHTML = `<div class="cm-empty-title serif">This month</div>
      <div class="cm-empty-copy">Connect your Google Sheet to see this month's spend update live as you log expenses.</div>`;
    section.appendChild(card);
    return section;
  }
  if(cm.empty){
    const card = el('div','cm-hero cm-hero-empty');
    card.innerHTML = `<div class="cm-empty-title serif">${cm.monthName}</div>
      <div class="cm-empty-copy">No expenses logged yet for ${cm.monthName} — day ${cm.dayOfMonth} of ${cm.daysInMonth}. Add one below and it'll show up here.</div>`;
    section.appendChild(card);
    return section;
  }

  const card = el('div','cm-hero');

  const top = el('div','cm-top');
  const left = el('div');
  left.appendChild(el('div','cm-label','THIS MONTH · ' + cm.monthName.toUpperCase() + ` · DAY ${cm.dayOfMonth} OF ${cm.daysInMonth}`));
  left.appendChild(el('div','cm-number', fmt1(cm.spend)));
  const pct = ((cm.spend/target)*100).toFixed(0);
  left.appendChild(el('div','cm-sub', `of ${fmt1(target)} monthly target (${pct}%)`));
  top.appendChild(left);

  const paceOver = cm.pace > target;
  const stamp = el('div', 'cm-stamp ' + (paceOver ? 'cm-stamp-over' : 'cm-stamp-ok'));
  stamp.innerHTML = `<div class="cm-stamp-big">${fmt1(cm.pace)}</div><div class="cm-stamp-small">PROJECTED BY MONTH END</div>`;
  top.appendChild(stamp);
  card.appendChild(top);

  // progress bar: spend so far vs target, with a marker for "expected pace" (target * day/daysInMonth)
  const expectedByNow = target * (cm.dayOfMonth / cm.daysInMonth);
  const track = el('div','cm-track');
  const fillPct = Math.min(100, (cm.spend/target)*100);
  const fill = el('div','cm-track-fill');
  fill.style.width = fillPct + '%';
  if(cm.spend > expectedByNow) fill.classList.add('cm-track-fill-over');
  const marker = el('div','cm-track-marker');
  marker.style.left = Math.min(100,(expectedByNow/target)*100) + '%';
  track.appendChild(fill);
  track.appendChild(marker);
  card.appendChild(track);
  card.appendChild(el('div','cm-track-caption','marker = where you\'d be if spending evenly through the month'));

  // compact group breakdown for the current month
  if(cm.groupSpend && cm.groupSpend.length){
    const groupsWrap = el('div','cm-groups');
    const maxG = Math.max(...cm.groupSpend.map(g=>g.spend), 1);
    cm.groupSpend.forEach(g=>{
      const row = el('div','cm-group-row');
      const name = el('div','cm-group-name');
      name.innerHTML = `<span class="legend-dot" style="background:${GROUP_COLORS[g.name]||'#8b96a8'}"></span>${g.name}`;
      row.appendChild(name);
      const t = el('div','cm-group-track');
      const f = el('div','cm-group-fill');
      f.style.width = Math.min(100,(g.spend/maxG)*100) + '%';
      f.style.background = GROUP_COLORS[g.name] || '#8b96a8';
      t.appendChild(f);
      row.appendChild(t);
      row.appendChild(el('div','cm-group-num', fmt1(g.spend)));
      groupsWrap.appendChild(row);
    });
    card.appendChild(groupsWrap);
  }

  section.appendChild(card);
  return section;
}

function buildMoMSparkline(months){
  const W = 220, H = 64, padX = 6, padY = 10;
  const vals = months.map(m=>m.total);
  const max = Math.max(...vals), min = Math.min(...vals);
  const range = (max-min) || 1;
  const stepX = (W - padX*2) / (months.length-1);
  const points = vals.map((v,i)=>{
    const x = padX + stepX*i;
    const y = padY + (H - padY*2) * (1 - (v-min)/range);
    return [x,y];
  });

  const lastUp = vals[vals.length-1] > vals[vals.length-2];
  const lineColor = lastUp ? '#d9765b' : '#7fae94';

  const pathD = points.map((p,i)=> (i===0?'M':'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L${points[points.length-1][0].toFixed(1)},${H-padY} L${points[0][0].toFixed(1)},${H-padY} Z`;

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible">`;
  svg += `<path d="${areaD}" fill="${lineColor}" opacity="0.08"/>`;
  svg += `<path d="${pathD}" fill="none" stroke="${lineColor}" stroke-width="1.6"/>`;
  points.forEach((p,i)=>{
    const isLast = i===points.length-1;
    svg += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${isLast?3:2}" fill="${isLast?lineColor:'#5c6779'}"><title>${months[i].name}: ${fmt1(vals[i])}</title></circle>`;
  });
  svg += `</svg>`;

  const wrap = document.createElement('div');
  wrap.innerHTML = svg;
  const svgEl = wrap.firstElementChild;

  const container = el('div','avg-spark-inner');
  container.appendChild(svgEl);
  const caption = el('div','avg-spark-caption');
  caption.innerHTML = `${months[0].name}\u2013${months[months.length-1].name} · latest ${fmt1(vals[vals.length-1])}`;
  container.appendChild(caption);
  return container;
}

function buildStackedChart(){
  const W = 960, H = 300, padL = 50, padB = 30, padT = 10, padR = 10;
  const chartW = W - padL - padR, chartH = H - padT - padB;

  // per-month totals by group
  const data = MONTHS.map((m,mi)=>{
    const row = {};
    GROUP_ORDER.forEach(g=>{
      row[g] = CATEGORIES.filter(c=>c.group===g).reduce((s,c)=>s+(c.monthly[mi]||0),0);
    });
    return row;
  });
  const totals = data.map(row=>GROUP_ORDER.reduce((s,g)=>s+row[g],0));
  const maxTotal = Math.max(...totals, TOTAL_TARGET);

  const barW = chartW/MONTHS.length*0.6;
  const gap = chartW/MONTHS.length;

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">`;

  // gridlines
  for(let i=0;i<=4;i++){
    const y = padT + chartH - (chartH*i/4);
    const val = Math.round(maxTotal*i/4);
    svg += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(139,150,168,0.12)" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-family="IBM Plex Mono" font-size="9.5" fill="#8b96a8">${(val/1000).toFixed(1)}k</text>`;
  }

  // target line
  const targetY = padT + chartH - (chartH*TOTAL_TARGET/maxTotal);
  svg += `<line x1="${padL}" y1="${targetY}" x2="${W-padR}" y2="${targetY}" stroke="#f2ede2" stroke-width="1.3" stroke-dasharray="4 3"/>`;
  svg += `<text x="${W-padR}" y="${targetY-6}" text-anchor="end" font-family="IBM Plex Mono" font-size="9.5" fill="#f2ede2">target ${(TOTAL_TARGET/1000).toFixed(1)}k</text>`;

  MONTHS.forEach((m,mi)=>{
    const x = padL + gap*mi + (gap-barW)/2;
    let yCursor = padT + chartH;
    GROUP_ORDER.forEach(g=>{
      const val = data[mi][g];
      const h = chartH*val/maxTotal;
      yCursor -= h;
      svg += `<rect x="${x}" y="${yCursor}" width="${barW}" height="${h}" fill="${GROUP_COLORS[g]}" opacity="0.92"><title>${g} ${m}: ${fmt1(val)}</title></rect>`;
    });
    svg += `<text x="${x+barW/2}" y="${padT+chartH+18}" text-anchor="middle" font-family="IBM Plex Mono" font-size="10.5" fill="#c7cbd4">${m}</text>`;
  });

  svg += `</svg>`;
  const container = document.createElement('div');
  container.innerHTML = svg;
  return container.firstElementChild;
}

function renderLedgerTableOnly(){
  const c = document.getElementById('ledger-table-container');
  if(c){ c.innerHTML=""; c.appendChild(buildLedgerTable()); }
}

function buildLedgerTable(){
  let rows = getCategories().map(c=>({
    ...c,
    variance: c.variance!==undefined ? c.variance : (c.target - c.avg) // positive = under budget, negative = over
  }));

  if(state.filterGroup!=="All") rows = rows.filter(r=>r.group===state.filterGroup);
  if(state.search.trim()) rows = rows.filter(r=>r.name.toLowerCase().includes(state.search.toLowerCase()));

  rows.sort((a,b)=>{
    let av = a[state.sortKey], bv = b[state.sortKey];
    if(typeof av === 'string') return state.sortDir==='asc' ? av.localeCompare(bv) : bv.localeCompare(av);
    return state.sortDir==='asc' ? av-bv : bv-av;
  });

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');
  const cols = [
    ["name","Category"], ["group","Group"], ["target","Target"], ["avg","7-mo Avg"], ["variance","Variance"]
  ];
  cols.forEach(([key,label])=>{
    const th = document.createElement('th');
    th.className = (key==='target'||key==='avg'||key==='variance') ? 'num' : '';
    th.textContent = label + (state.sortKey===key ? (state.sortDir==='asc'?' ▲':' ▼') : '');
    th.onclick = ()=>{
      if(state.sortKey===key) state.sortDir = state.sortDir==='asc'?'desc':'asc';
      else { state.sortKey=key; state.sortDir='desc'; }
      renderLedgerTableOnly();
    };
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const maxAvg = Math.max(...CATEGORIES.map(c=>c.avg), 1);

  rows.forEach(r=>{
    const tr = document.createElement('tr');

    const tdName = document.createElement('td');
    tdName.className = 'cat-name';
    tdName.textContent = r.name;
    tr.appendChild(tdName);

    const tdGroup = document.createElement('td');
    const tag = document.createElement('span');
    tag.className = 'group-tag';
    tag.textContent = r.group;
    tag.style.background = GROUP_COLORS[r.group]+"26";
    tag.style.color = GROUP_COLORS[r.group];
    tdGroup.appendChild(tag);
    tr.appendChild(tdGroup);

    const tdTarget = document.createElement('td');
    tdTarget.className = 'num';
    tdTarget.textContent = fmt1(r.target);
    tr.appendChild(tdTarget);

    const tdAvg = document.createElement('td');
    tdAvg.className = 'num';
    const barTrack = document.createElement('span');
    barTrack.className = 'mini-bar-track';
    const barFill = document.createElement('span');
    barFill.className = 'mini-bar-fill';
    barFill.style.width = Math.min(100,(r.avg/maxAvg)*100)+"%";
    barFill.style.background = r.avg>r.target ? '#d9765b' : '#7fae94';
    const barTarget = document.createElement('span');
    barTarget.className = 'mini-bar-target';
    barTarget.style.left = Math.min(100,(r.target/maxAvg)*100)+"%";
    barTrack.appendChild(barFill);
    barTrack.appendChild(barTarget);
    tdAvg.appendChild(document.createTextNode(fmt1(r.avg)+" "));
    tdAvg.appendChild(barTrack);
    tr.appendChild(tdAvg);

    const tdVar = document.createElement('td');
    tdVar.className = 'num ' + (r.variance<0?'var-over':'var-under');
    tdVar.textContent = (r.variance<0?'−':'+') + fmt1(Math.abs(r.variance));
    tr.appendChild(tdVar);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

  catSelect.className = 'search-input modal-input';
  catSelect.disabled = disabled;
  const opts = getCategoryOptions();
  const blank = document.createElement('option'); blank.value=''; blank.textContent = disabled ? 'Connect sheet first' : 'Select category…';
  catSelect.appendChild(blank);
  opts.forEach(o=>{
    const opt = document.createElement('option');
    opt.value = o.name; opt.textContent = o.name + ' (' + o.group + ')';
    catSelect.appendChild(opt);
  });
  catSelect.value = state.addForm.category;
  catSelect.onchange = e=>state.addForm.category = e.target.value;

  const descInput = document.createElement('input');
  descInput.type = 'text';
  descInput.className = 'search-input modal-input';
  descInput.placeholder = 'Description (optional)';
  descInput.value = state.addForm.description;
  descInput.disabled = disabled;
  descInput.oninput = e=>state.addForm.description = e.target.value;

  const amountInput = document.createElement('input');
  amountInput.type = 'number';
  amountInput.step = '0.01';
  amountInput.min = '0';
  amountInput.className = 'search-input modal-input';
  amountInput.placeholder = 'Amount (PLN)';
  amountInput.value = state.addForm.amount;
  amountInput.disabled = disabled;
  amountInput.oninput = e=>state.addForm.amount = e.target.value;

  [dateInput, catSelect, descInput, amountInput].forEach(i=>grid.appendChild(i));
  box.appendChild(grid);

  const btnRow = el('div','sim-buttons');
  const addBtn = document.createElement('button');
  addBtn.className = 'btn';
  addBtn.textContent = disabled ? 'Connect sheet to add' : 'Add expense';
  addBtn.disabled = disabled;
  addBtn.onclick = async ()=>{
    if(!state.addForm.category || !state.addForm.amount){
      state.addStatus = {type:'err', msg:'Pick a category and enter an amount.'};
      render(); return;
    }
    addBtn.textContent = 'Adding…'; addBtn.disabled = true;
    try{
      await postExpense(state.addForm);
      state.addStatus = {type:'ok', msg:'Added to your sheet.'};
      state.addForm = { date: new Date().toISOString().slice(0,10), category: "", description: "", amount: "" };
      await fetchLiveData();
    }catch(err){
      state.addStatus = {type:'err', msg: err.message};
      render();
    }
  };
  btnRow.appendChild(addBtn);
  box.appendChild(btnRow);

  if(state.addStatus){
    const s = el('div', 'add-status ' + (state.addStatus.type==='ok'?'add-status-ok':'add-status-err'), state.addStatus.msg);
    box.appendChild(s);
  }

  wrap.appendChild(box);
  return wrap;
}

/* ============ LOGGED ENTRIES SECTION ============ */
function buildLoggedEntriesSection(){
  const entries = getEntries();
  if(!CONFIG.url) return el('div');

  const wrap = el('div','section wrap');
  const head = el('div','section-head');
  head.appendChild(el('div','section-title serif','Logged this period'));
  head.appendChild(el('div','section-note', entries.length + ' entries · most recent first'));
  wrap.appendChild(head);

  if(entries.length===0){
    wrap.appendChild(el('div','section-note','No expenses logged yet — add one above and it will show up here.'));
    return wrap;
  }

  const table = document.createElement('table');
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr><th>Date</th><th>Category</th><th>Group</th><th>Description</th><th class="num">Amount</th></tr>';
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  entries.slice(0,50).forEach(en=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${en.date}</td><td class="cat-name">${en.category}</td><td>${en.group||''}</td><td class="cat-name">${en.description||''}</td><td class="num">${fmt1(en.amount)}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

/* ============ SIMULATOR SECTION ============ */
function buildSimSection(){
  const wrap = el('div','section wrap');
  const head = el('div','section-head');
  head.appendChild(el('div','section-title serif','Budget simulator'));
  head.appendChild(el('div','section-note','drag targets to test a new monthly plan'));
  wrap.appendChild(head);

  const box = el('div','sim-box');
  box.id = 'sim-box';
  renderSimBox(box);
  wrap.appendChild(box);
  return wrap;
}

function renderSimBox(box){
  box.innerHTML = "";
  const {total, byGroup} = computeSimTotals();
  const cutPct = (total>0) ? (total-TOTAL_TARGET)/ (TOTAL_AVG) : 0;

  const summary = el('div','sim-summary');
  const stats = [
    ["Simulated monthly total", fmt1(total)],
    ["vs. actual avg ("+fmt1(TOTAL_AVG)+")", (total-TOTAL_AVG<=0?'−':'+')+fmt1(Math.abs(total-TOTAL_AVG))],
    ["vs. target ceiling ("+fmt1(TOTAL_TARGET)+")", (total-TOTAL_TARGET<=0?'−':'+')+fmt1(Math.abs(total-TOTAL_TARGET))],
  ];
  stats.forEach(([k,v])=>{
    const s = el('div','sim-stat');
    s.appendChild(el('div','k',k));
    const vEl = el('div','v mono',v);
    if(k.startsWith('Simulated')) vEl.style.color = total<=TOTAL_TARGET ? '#7fae94' : '#d9765b';
    s.appendChild(vEl);
    summary.appendChild(s);
  });
  box.appendChild(summary);

  const sorted = [...CATEGORIES].sort((a,b)=>b.avg-a.avg);
  sorted.forEach(c=>{
    const row = el('div','sim-row');
    row.appendChild(el('div','sim-row-name',c.name));

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.className = 'sim-slider';
    slider.min = 0;
    slider.max = Math.max(c.avg*1.6, c.target*1.6, 100);
    slider.step = 5;
    slider.value = state.sim[c.name];
    const valEl = el('div','sim-val mono', fmt1(state.sim[c.name]));
    slider.oninput = (e)=>{
      state.sim[c.name] = parseFloat(e.target.value);
      valEl.textContent = fmt1(state.sim[c.name]);
      renderSimBox(box);
    };
    row.appendChild(slider);
    row.appendChild(valEl);
    row.appendChild(el('div','sim-actual', 'avg '+fmt1(c.avg)));
    box.appendChild(row);
  });

  const btnRow = el('div','sim-buttons');
  const resetTarget = document.createElement('button');
  resetTarget.className = 'btn';
  resetTarget.textContent = 'Reset to budget targets';
  resetTarget.onclick = ()=>{ CATEGORIES.forEach(c=>state.sim[c.name]=c.target); renderSimBox(box); };
  const resetActual = document.createElement('button');
  resetActual.className = 'btn';
  resetActual.textContent = 'Reset to 7-mo averages';
  resetActual.onclick = ()=>{ CATEGORIES.forEach(c=>state.sim[c.name]=c.avg); renderSimBox(box); };
  btnRow.appendChild(resetTarget);
  btnRow.appendChild(resetActual);
  box.appendChild(btnRow);
}

/* ============ FOOTER ============ */
function buildFooter(){
  const f = document.createElement('footer');
  const inner = el('div','wrap');
  inner.textContent = 'Source: bills26 actuals → Budget 2026 (NEW) targets → this dashboard. Built from MainFinances_FromJuly2026.xlsx.';
  f.appendChild(inner);
  return f;
}

render();
if(CONFIG.url && CONFIG.token) fetchLiveData();
